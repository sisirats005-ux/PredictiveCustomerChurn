# Configuration parameters for the ConnectTel Customer Churn Prediction Pipeline

# Data and Splitting
data:
  raw_path: "data/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  test_size: 0.2
  random_state: 42
  target_col: "Churn"

# Column Configurations
features:
  numeric_cols: 
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
    - "ServiceCount"
    - "TotalChargesPerTenure"
    - "CLV"
    - "ChargesRatio"
    - "BillingRisk"
  categorical_cols:
    - "gender"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"
  remainder_cols:
    - "SeniorCitizen"
    - "HasFamily"
    - "LongTermCustomer"
    - "AutoPayment"
    - "Fiber_x_MonthToMonth"
    - "Fiber_x_NoTechSupport"
    - "MonthToMonth_x_NoAutoPay"
    - "HighRiskContractPay"
    - "HighRiskProfile"
    - "Persona_New_HighSpend"
    - "Persona_Loyal_HighSpend"

# Model Selection and CV
cv:
  folds: 5
  scoring: "roc_auc"

# Hyperparameter Search Grids
hyperparameters:
  random_forest:
    n_estimators: [100, 200]
    max_depth: [5, 8, null]
    min_samples_split: [2, 5]
  xgboost:
    n_estimators: [100, 200]
    max_depth: [3, 5]
    learning_rate: [0.05, 0.1]

# Business and ROI Model Parameters
business:
  arpu: 65.0                  # Average Revenue Per User per month ($)
  churn_cost: 500.0           # Re-acquisition cost + lost onboarding value per churned customer ($)
  retention_offer_cost: 50.0  # Average cost of promotional/loyalty discount package ($)
  campaign_success_rate: 0.25 # Expected percentage of targeted customers who accept the offer and stay
  market_size: 100000         # Total active customer base size for business impact scaling
  cac: 250.0                  # Customer Acquisition Cost ($)
